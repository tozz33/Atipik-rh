# Déclenche un redéploiement Vercel (push vide sur main) et vérifie le sitemap SEO.
# Programmé : 11 juin 2026 à 07:00 (Europe/Paris) = 05:00 UTC.
name: Déploiement production programmé

on:
  schedule:
    - cron: '0 5 11 6 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déclencher le build Vercel (commit vide)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: déploiement production programmé — article blog obligation formation non-discrimination"
          git push

      - name: Vérification SEO post-déploiement
        run: node scripts/post-deploy-seo.mjs
        env:
          SITE_URL: https://www.atipikrh.com
