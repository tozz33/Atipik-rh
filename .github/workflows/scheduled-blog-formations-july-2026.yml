# Redéploiement production programmé — articles blog formations numérique & IA (juillet 2026).
# Article Essentiels : publication cible 16 juillet 2026 à 07:00 (Europe/Paris) = 05:00 UTC.
# Article IA : publication cible 20 juillet 2026 à 07:00 (Europe/Paris) = 05:00 UTC.
#
# Stratégie de merge recommandée :
#   PR 1 (15-16 juil.) : article Essentiels uniquement → merge le 16 juillet
#   PR 2 (19-20 juil.) : article IA → merge le 20 juillet
name: Déploiement blog formations juillet 2026

on:
  schedule:
    - cron: '0 5 16 7 *'
    - cron: '0 5 20 7 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déclencher le build Vercel (commit vide)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: déploiement production programmé — articles blog formations numérique & IA sept. 2026"
          git push

      - name: Vérification SEO post-déploiement
        run: node scripts/post-deploy-seo.mjs
        env:
          SITE_URL: https://www.atipikrh.com
